[project]
name = "norvence-factum-mini"
version = "0.1.0"
description = "Extraction des champs de factures fournisseurs par LLM et normalisation avant export comptable."
requires-python = ">=3.11,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "coverage>=7.10.6,<8",
    "pytest>=8,<9",
    "pytest-cov>=7,<8",
    "ruff>=0.6,<0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# Couverture totale mesurée le 2026-10-06 : 90,22 %. Fowler juge normaux les hauts 80 / 90 %.
fail_under = 90  # mesure arrondie vers le bas : sous 90 %, la CI échoue
# Le seuil est comparé au total arrondi à cette précision : avec 0, 89,6 % passerait pour 90 %.
precision = 2
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
